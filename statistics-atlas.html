const isDone  = id => state.done.has(id);
const isReady = id => !isDone(id) && BY_ID[id].prereqs.every(isDone);
function matches(n){
  if (!state.levels.has(n.level)) return false;
  if (!state.domains.has(n.domain)) return false;
  if (state.hideDone && isDone(n.id)) return false;
  if (state.q){
    const q = state.q.toLowerCase();
    if (!(n.label.toLowerCase().includes(q) || n.note.toLowerCase().includes(q) || DOMAINS[n.domain].name.toLowerCase().includes(q))) return false;
  }
  return true;
}
const esc = s => s.replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------------- radial layout ---------------- */
const R = {1:150, 2:268, 3:386, 4:504, 5:622};
const CX = 0, CY = 0;
let positions = {};

function layout(nodes){
  positions = {};
  const counts = {};
  DOMAIN_ORDER.forEach(d => counts[d] = 0);
  nodes.forEach(n => counts[n.domain]++);
  const active = DOMAIN_ORDER.filter(d => counts[d] > 0);
  const total = nodes.length || 1;
  const gap = 1.1 * Math.PI / 180;
  let a = -Math.PI / 2;
  const wedge = {};
  active.forEach(d => {
    const span = (counts[d] / total) * (Math.PI * 2);
    wedge[d] = {start: a + gap/2, end: a + span - gap/2, mid: a + span/2, span};
    a += span;
  });
  active.forEach(d => {
    for (let lv = 1; lv <= 5; lv++){
      const group = nodes.filter(n => n.domain === d && n.level === lv)
                         .sort((x,y) => x.step - y.step);
      const k = group.length;
      if (!k) continue;
      const w = wedge[d];
      group.forEach((n,i) => {
        const t = k === 1 ? 0.5 : (i + 0.5) / k;
        const ang = w.start + t * (w.end - w.start);
        const rr = R[lv] + (i % 2 ? 22 : -22) * (k > 3 ? 1 : 0);
        positions[n.id] = {x: CX + rr*Math.cos(ang), y: CY + rr*Math.sin(ang), a: ang, r: rr};
      });
    }
  });
  return wedge;
}

/* ---------------- chart rendering ---------------- */
const svg = document.getElementById("chart");
let vb = {x:-760, y:-760, w:1520, h:1520};
const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs, text){
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (text !== undefined) e.textContent = text;
  return e;
}
function applyVB(){ svg.setAttribute("viewBox", `${vb.x} ${vb.y} ${vb.w} ${vb.h}`); }

function renderChart(){
  const nodes = DATA.filter(matches);
  const wedge = layout(nodes);
  const vis = new Set(nodes.map(n => n.id));
  svg.innerHTML = "";
  applyVB();

  const gRing = el("g",{}), gEdge = el("g",{}), gNode = el("g",{}), gLab = el("g",{});
  svg.append(gRing, gEdge, gNode, gLab);

  /* rings */
  for (let lv = 1; lv <= 5; lv++){
    if (!state.levels.has(lv)) continue;
    gRing.append(el("circle",{cx:0,cy:0,r:R[lv],fill:"none",stroke:"#1B2440","stroke-width":1}));
    gRing.append(el("text",{x:6,y:-R[lv]+4,fill:"#4A5878","font-family":"var(--mono)","font-size":11,"letter-spacing":"0.2em"}, "LEVEL " + lv));
  }

  /* field labels on the rim */
  for (const d in wedge){
    const w = wedge[d];
    if (w.span < 0.12) continue;
    const rr = 690, ang = w.mid;
    const x = rr*Math.cos(ang), y = rr*Math.sin(ang);
    const left = Math.cos(ang) < -0.05;
    const t = el("text",{x,y,fill:DOMAINS[d].color,"font-family":"var(--mono)","font-size":12.5,
      "letter-spacing":"0.14em","text-anchor":left?"end":(Math.abs(Math.cos(ang))<0.05?"middle":"start"),
      "dominant-baseline":"middle","opacity":.85}, DOMAINS[d].name.toUpperCase());
    gLab.append(t);
  }

  /* edges */
  const hl = state.sel || state.hover;
  const near = new Set();
  if (hl){ near.add(hl); BY_ID[hl].prereqs.forEach(p=>near.add(p)); BY_ID[hl].unlocks.forEach(u=>near.add(u)); }
  nodes.forEach(n => {
    n.prereqs.forEach(p => {
      if (!vis.has(p)) return;
      const A = positions[p], B = positions[n.id];
      if (!A || !B) return;
      const mx = (A.x+B.x)/2, my = (A.y+B.y)/2;
      const cx = mx*0.72, cy = my*0.72;
      const touched = hl && (n.id === hl || p === hl);
      const dimmed = hl && !touched;
      gEdge.append(el("path",{
        d:`M${A.x.toFixed(1)},${A.y.toFixed(1)} Q${cx.toFixed(1)},${cy.toFixed(1)} ${B.x.toFixed(1)},${B.y.toFixed(1)}`,
        fill:"none",
        stroke: touched ? DOMAINS[n.domain].color : (isDone(p)&&isDone(n.id) ? "#5C4A24" : "#243052"),
        "stroke-width": touched ? 1.5 : 0.7,
        opacity: dimmed ? 0.07 : (touched ? 0.85 : 0.5)
      }));
    });
  });

  /* nodes */
  const showAllLabels = state.labels || nodes.length <= 70;
  nodes.forEach(n => {
    const P = positions[n.id];
    const c = DOMAINS[n.domain].color;
    const done = isDone(n.id), ready = isReady(n.id);
    const dimmed = hl && !near.has(n.id);
    const rad = 4 + Math.min(6, Math.sqrt(n.unlocks.length) * 1.9);
    const g = el("g",{class:"nd","data-id":n.id, style:"cursor:pointer", opacity: dimmed ? 0.16 : 1});
    const craft = isCraft(n.domain);
    const mark = (rr, a) => craft
      ? el("rect", Object.assign({x:P.x-rr, y:P.y-rr, width:rr*2, height:rr*2, rx:rr*0.34}, a))
      : el("circle", Object.assign({cx:P.x, cy:P.y, r:rr}, a));
    if (done){
      g.append(mark(rad+6,{fill:"#F0B95E",opacity:.14}));
      g.append(mark(rad,{fill:"#F0B95E",stroke:"#FFF0D0","stroke-width":.8}));
    } else if (ready){
      g.append(mark(rad+4.5,{fill:"none",stroke:"#4FD1E0","stroke-width":1,"stroke-dasharray":"2 3",opacity:.9}));
      g.append(mark(rad,{fill:c,opacity:.9}));
    } else {
      g.append(mark(rad,{fill:"#0D1424",stroke:c,"stroke-width":1.2,opacity:.85}));
    }
    if (n.id === state.sel){
      g.append(mark(rad+11,{fill:"none",stroke:"#FFFFFF","stroke-width":1,opacity:.7}));
    }
    g.append(el("title",{}, n.label + "  (Level " + n.level + ")"));
    gNode.append(g);

    if (showAllLabels || n.id === state.sel || n.id === state.hover || near.has(n.id)){
      const left = Math.cos(P.a) < 0;
      const off = rad + 7;
      const lx = P.x + Math.cos(P.a)*off, ly = P.y + Math.sin(P.a)*off;
      gLab.append(el("text",{
        x:lx, y:ly, fill: done ? "#F0B95E" : (dimmed ? "#3A4664" : "#B9C4DC"),
        "font-family":"var(--sans)","font-size":10.5,"text-anchor":left?"end":"start",
        "dominant-baseline":"middle","paint-order":"stroke","stroke":"#090D18","stroke-width":2.6,
        opacity: dimmed ? .25 : 1, style:"pointer-events:none"
      }, n.label));
    }
  });

  if (!nodes.length){
    gLab.append(el("text",{x:0,y:0,fill:"#8593B0","font-size":16,"text-anchor":"middle"},"No concepts match these filters."));
  }
}

/* pan + zoom */
(function interactions(){
  let dragging = false, moved = false, sx = 0, sy = 0, ox = 0, oy = 0;
  svg.addEventListener("pointerdown", e => {
    dragging = true; moved = false; sx = e.clientX; sy = e.clientY; ox = vb.x; oy = vb.y;
    svg.classList.add("grabbing"); svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener("pointermove", e => {
    const t = e.target.closest ? e.target.closest(".nd") : null;
    if (!dragging){
      const id = t ? t.dataset.id : null;
      if (id !== state.hover){ state.hover = id; renderChart(); }
      return;
    }
    const k = vb.w / svg.clientWidth;
    const dx = (e.clientX - sx) * k, dy = (e.clientY - sy) * k;
    if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
    vb.x = ox - dx; vb.y = oy - dy; applyVB();
  });
  svg.addEventListener("pointerup", e => {
    dragging = false; svg.classList.remove("grabbing");
    if (moved) return;
    const t = e.target.closest ? e.target.closest(".nd") : null;
    select(t ? t.dataset.id : null);
  });
  svg.addEventListener("pointerleave", () => { dragging = false; svg.classList.remove("grabbing"); if (state.hover){ state.hover = null; renderChart(); } });
  svg.addEventListener("wheel", e => {
    e.preventDefault();
    const r = svg.getBoundingClientRect();
    const px = vb.x + (e.clientX - r.left)/r.width * vb.w;
    const py = vb.y + (e.clientY - r.top)/r.height * vb.h;
    const f = e.deltaY > 0 ? 1.13 : 0.885;
    const nw = Math.max(260, Math.min(3400, vb.w * f));
    const s = nw / vb.w;
    vb.x = px - (px - vb.x) * s; vb.y = py - (py - vb.y) * s;
    vb.w = nw; vb.h = nw; applyVB();
  }, {passive:false});
  function zoom(f){
    const cx = vb.x + vb.w/2, cy = vb.y + vb.h/2;
    vb.w = Math.max(260, Math.min(3400, vb.w * f)); vb.h = vb.w;
    vb.x = cx - vb.w/2; vb.y = cy - vb.h/2; applyVB();
  }
  document.getElementById("zoomIn").onclick = () => zoom(0.8);
  document.getElementById("zoomOut").onclick = () => zoom(1.25);
  document.getElementById("zoomFit").onclick = () => { vb = {x:-780,y:-780,w:1560,h:1560}; applyVB(); };
})();

function select(id){
  state.sel = id;
  renderChart();
  renderPanel();
  if (id){
    const P = positions[id];
    if (P && (P.x < vb.x || P.x > vb.x+vb.w || P.y < vb.y || P.y > vb.y+vb.h)){
      vb.x = P.x - vb.w/2; vb.y = P.y - vb.h/2; applyVB();
    }
  }
}

/* ---------------- detail panel ---------------- */

  const p = document.getElementById("panel");
  if (!state.sel){

      <h3>Pick any star</h3>

      <div class="eyebrow" style="color:${DOMAINS[n.domain].color}">Level ${n.level} &middot; ${esc(DOMAINS[n.domain].name)}</div>

                   : `<p class="empty">Nothing. This is an entry point.</p>`}
      <h5>Unlocks (${un.length})</h5>
      ${un.length ? `<ul class="linklist">${un.map(x=>`<li><button data-go="${x.id}" class="${isDone(x.id)?'done':''}">${esc(x.label)}</button></li>`).join("")}</ul>`
                  : `<p class="empty">Nothing further depends on this one.</p>`}

/* ---------------- checklist ---------------- */
function itemHTML(n, showStep){
  const done = isDone(n.id), ready = isReady(n.id);
  const unmet = n.prereqs.filter(p => !isDone(p)).map(p => BY_ID[p].label);
  return `<button class="item ${done?'done':''} ${ready?'ready':''}" data-mark="${n.id}">
    ${showStep ? `<span class="step">${String(n.step).padStart(2,"0")}</span>` : ``}
    <span class="box">&#10003;</span>
    <span><span class="t">${esc(n.label)}${showStep?`<span class="lvtag">L${n.level}</span>`:``}</span>
    <span class="d">${esc(n.note)}</span>
    ${unmet.length ? `<span class="needs">needs: ${esc(unmet.slice(0,3).join(", "))}${unmet.length>3?" +"+(unmet.length-3):""}</span>` : ``}
    </span></button>`;
}
function readyStripHTML(){
  const ready = DATA.filter(n => isReady(n.id) && state.levels.has(n.level) && state.domains.has(n.domain))
                    .sort((a,b)=>a.level-b.level||a.depth-b.depth||a.label.localeCompare(b.label)).slice(0,14);
  if (!ready.length) return "";
  return `<div class="ready-strip"><h4>Ready to start</h4>
    <p>Every prerequisite for these is already checked off. Work left to right.</p>
    <div class="ready-items">${ready.map(n=>`<button data-go="${n.id}">${esc(n.label)} <span style="opacity:.6">L${n.level}</span></button>`).join("")}</div></div>`;
}
function renderList(){
  const body = document.getElementById("listBody");
  const nodes = DATA.filter(matches);
  let html = readyStripHTML();
  html += state.group === "field" ? listByField(nodes) : listByLevel(nodes);
  if (!nodes.length) html += `<p class="empty">No concepts match these filters.</p>`;
  body.innerHTML = html;
  body.querySelectorAll("[data-mark]").forEach(b => b.onclick = () => toggle(b.dataset.mark));
  body.querySelectorAll("[data-go]").forEach(b => b.onclick = () => toggle(b.dataset.go));
}
function listByField(nodes){
  let html = "";
  for (const d of DOMAIN_ORDER){
    const items = nodes.filter(n => n.domain === d).sort((a,b) => a.step - b.step);
    if (!items.length) continue;
    const all = DATA.filter(n => n.domain === d);
    const done = all.filter(n => isDone(n.id)).length;
    html += `<section class="field-block">
      <div class="field-head">
        <span class="sw" style="background:${DOMAINS[d].color};border-radius:${isCraft(d)?"3px":"50%"}"></span>
        <h3>${esc(DOMAINS[d].name)}</h3>
        <span class="kind">${isCraft(d) ? "craft" : "statistics"}</span>
        <span class="counts">${done}/${all.length}</span>
      </div>
      <div class="bar"><i style="width:${(done/all.length*100).toFixed(1)}%"></i></div>
      <div class="seq">${items.map(n => itemHTML(n, true)).join("")}</div>
    </section>`;
  }
  return html;
}
function listByLevel(nodes){
  let html = "";
  for (let lv = 1; lv <= 5; lv++){
    if (!state.levels.has(lv)) continue;
    const inLv = nodes.filter(n => n.level === lv);
    if (!inLv.length) continue;
    const allLv = DATA.filter(n => n.level === lv);
    const doneLv = allLv.filter(n => isDone(n.id)).length;
    html += `<section class="lvl-block"><div class="lvl-head">
        <div class="lvl-num">${lv}</div>
        <div><div class="lvl-name">${LEVELS[lv].name}</div></div>
        <div class="lvl-desc">${LEVELS[lv].desc}</div>
        <div class="counts">${doneLv}/${allLv.length}</div>
      </div>
      <div class="bar"><i style="width:${(doneLv/allLv.length*100).toFixed(1)}%"></i></div>`;
    for (const d of DOMAIN_ORDER){
      const items = inLv.filter(n => n.domain === d).sort((a,b) => a.step - b.step);
      if (!items.length) continue;
      const allD = DATA.filter(n => n.level===lv && n.domain===d);
      const doneD = allD.filter(n=>isDone(n.id)).length;
      html += `<div class="dom-group"><div class="dom-head">
        <span class="sw" style="background:${DOMAINS[d].color};border-radius:${isCraft(d)?"2px":"50%"}"></span>
        ${esc(DOMAINS[d].name)}<span class="frac">${doneD}/${allD.length}</span></div>
        <div class="items">${items.map(n => itemHTML(n, false)).join("")}</div></div>`;
    }
    html += `</section>`;
  }
  return html;
}

/* ---------------- progress drawer ---------------- */
function exportMarkdown(){
  const pct = Math.round(state.done.size / DATA.length * 100);
  let out = `# Atlas of Statistics, progress\n\n${state.done.size} of ${DATA.length} complete (${pct}%), exported ${new Date().toISOString().slice(0,10)}\n`;
  for (const d of DOMAIN_ORDER){
    const items = DATA.filter(n => n.domain === d).sort((a,b) => a.step - b.step);
    const done = items.filter(n => isDone(n.id)).length;
    out += `\n## ${DOMAINS[d].name} (${done}/${items.length})\n\n`;
    items.forEach(n => {
      out += `- [${isDone(n.id) ? "x" : " "}] ${String(n.step).padStart(2,"0")}. ${n.label} (L${n.level})\n`;
    });
  }
  return out;
}
function download(name, text){
  try{
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([text], {type:"text/plain"}));
    a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    return true;
  }catch(e){ return false; }
}
function openDrawer(){
  const mount = document.getElementById("drawerMount");
  const pct = state.done.size / DATA.length;
  const lvRows = [1,2,3,4,5].map(lv => {
    const all = DATA.filter(n => n.level === lv), dn = all.filter(n => isDone(n.id)).length;
    return `<div class="minirow"><span>Level ${lv}, ${LEVELS[lv].name}</span>
      <span class="track"><i style="width:${(dn/all.length*100).toFixed(1)}%;background:var(--gold)"></i></span>
      <span class="num">${dn}/${all.length}</span></div>`;
  }).join("");
  const fieldRows = DOMAIN_ORDER.map(d => {
    const all = DATA.filter(n => n.domain === d), dn = all.filter(n => isDone(n.id)).length;
    return `<div class="minirow"><span>${esc(DOMAINS[d].name)}</span>
      <span class="track"><i style="width:${(dn/all.length*100).toFixed(1)}%;background:${DOMAINS[d].color}"></i></span>
      <span class="num">${dn}/${all.length}</span></div>`;
  }).join("");

  const pts = state.log.slice(-40);
  let spark = `<p class="empty" style="margin:0">Check something off and your day-by-day progress starts plotting here.</p>`;
  if (pts.length > 1){
    const max = Math.max(...pts.map(p => p[1]), 1);
    const W = 600, H = 60;
    const path = pts.map((p,i) => `${(i/(pts.length-1)*W).toFixed(1)},${(H - p[1]/max*(H-8)).toFixed(1)}`).join(" ");
    spark = `<svg class="spark" viewBox="0 0 ${W} ${H+10}" preserveAspectRatio="none">
      <polyline points="${path}" fill="none" stroke="#F0B95E" stroke-width="2" vector-effect="non-scaling-stroke"/>
      </svg>
      <div class="counts" style="margin-top:5px">${pts[0][0]} to ${pts[pts.length-1][0]}, peak ${max} concepts</div>`;
  }

  const scrim = document.createElement("div");
  scrim.className = "scrim";
  scrim.innerHTML = `<div class="drawer" role="dialog" aria-label="Progress and backup">
    <button class="close" data-close>&times;</button>
    <h2>${state.done.size} of ${DATA.length} mastered</h2>
    <p class="sub">${Math.round(pct*100)}% of the atlas${lastSaved ? ", last saved " + lastSaved.slice(0,16).replace("T"," ") : ""}</p>
    <h5>By level</h5><div class="minibars">${lvRows}</div>
    <h5>By field</h5><div class="minibars">${fieldRows}</div>
    <h5>Progress over time</h5>${spark}
    <h5>Back up or move your progress</h5>
    <p class="sub" style="margin:0 0 8px">Your checkmarks save automatically in this chat. Copy the code below to keep a copy elsewhere, or paste an old code back in to restore it.</p>
    <textarea id="codeBox" spellcheck="false">${[...state.done].join(",")}</textarea>
    <div class="btnrow">
      <button data-act="copy" class="primary">Copy code</button>
      <button data-act="restore">Restore from code</button>
      <button data-act="md">Download checklist as Markdown</button>
    </div>
    <div class="msg" id="drawerMsg"></div>
  </div>`;
  mount.innerHTML = "";
  mount.appendChild(scrim);
  const msg = t => document.getElementById("drawerMsg").textContent = t;
  scrim.addEventListener("click", e => { if (e.target === scrim) mount.innerHTML = ""; });
  scrim.querySelector("[data-close]").onclick = () => mount.innerHTML = "";
  scrim.querySelectorAll("[data-act]").forEach(b => b.onclick = () => {
    const box = document.getElementById("codeBox");
    if (b.dataset.act === "copy"){
      box.select();
      if (navigator.clipboard) navigator.clipboard.writeText(box.value).then(()=>msg("Copied. Paste it somewhere safe."), ()=>msg("Select the text above and copy it manually."));
      else msg("Select the text above and copy it manually.");
    }
    if (b.dataset.act === "restore"){
      const ids = box.value.split(/[,\s]+/).map(s => s.trim()).filter(s => BY_ID[s]);
      if (!ids.length){ msg("No recognizable concept ids in that code."); return; }
      state.done = new Set(ids);
      save(); renderAll();
      msg("Restored " + ids.length + " concepts.");
      setTimeout(openDrawer, 400);
    }
    if (b.dataset.act === "md"){
      msg(download("statistics-atlas-progress.md", exportMarkdown())
        ? "Downloaded." : "Download blocked here. Copy the code instead.");
    }
  });
}

  });
  document.getElementById("foot").textContent =
    DATA.length + " concepts, " + DATA.reduce((s,n)=>s+n.prereqs.length,0) + " prerequisite links, " +
    DOMAIN_ORDER.length + " fields. Progress saves automatically.";
  document.getElementById("tot").textContent = DATA.length;
}
function renderAll(){
  renderHeader();
  if (state.view === "chart"){ renderChart(); renderPanel(); } else { renderList(); }
}

/* ---------------- controls wiring ---------------- */
(function buildControls(){
  const lc = document.getElementById("levelChips");
  for (let lv = 1; lv <= 5; lv++){
    const b = document.createElement("button");
    b.className = "chip lvl-" + lv;
    b.dataset.lv = lv;
    b.setAttribute("aria-pressed","true");
    b.innerHTML = `<span class="dot"></span>L${lv} ${LEVELS[lv].name} <span class="n"></span>`;
    b.onclick = () => {
      if (state.levels.has(lv)) state.levels.delete(lv); else state.levels.add(lv);
      b.setAttribute("aria-pressed", state.levels.has(lv));
      renderAll();
    };
    lc.append(b);
  }
  const lg = document.getElementById("legend");
  const rowFor = {};
  const addRows = (group, title) => {
    const h = document.createElement("h4");
    h.textContent = title;
    h.style.marginTop = group === "craft" ? "10px" : "0";
    lg.append(h);
    DOMAIN_ORDER.filter(d => DOMAINS[d].group === group).forEach(d => {
      const row = document.createElement("div");
      row.className = "row";
      row.innerHTML = `<span class="sw" style="background:${DOMAINS[d].color};${group==="craft"?"border-radius:3px":"border-radius:50%"}"></span>${DOMAINS[d].name}`;
      row.onclick = () => {
        if (state.domains.has(d)) state.domains.delete(d); else state.domains.add(d);
        syncLegend();
        renderAll();
      };
      rowFor[d] = row;
      lg.append(row);
    });
  };
  function syncLegend(){
    DOMAIN_ORDER.forEach(d => rowFor[d] && rowFor[d].classList.toggle("off", !state.domains.has(d)));
  }
  lg.querySelector("h4").remove();
  addRows("stat","Core statistics");
  addRows("craft","Data science craft");
  const quick = document.createElement("div");
  quick.className = "quick";
  quick.innerHTML = `<button data-g="all">All</button><button data-g="stat">Stats only</button><button data-g="craft">Craft only</button>`;
  quick.querySelectorAll("button").forEach(b => b.onclick = () => {
    state.domains = new Set(b.dataset.g === "all" ? DOMAIN_ORDER : DOMAIN_ORDER.filter(d => DOMAINS[d].group === b.dataset.g));
    syncLegend();
    renderAll();
  });
  lg.append(quick);
  const setView = v => {
    state.view = v;
    document.getElementById("viewChart").setAttribute("aria-pressed", v==="chart");
    document.getElementById("viewList").setAttribute("aria-pressed", v==="list");
    document.getElementById("stage").classList.toggle("hidden", v!=="chart");
    document.getElementById("listView").classList.toggle("hidden", v!=="list");
    renderAll();
  };
  document.getElementById("viewChart").onclick = () => setView("chart");
  document.getElementById("viewList").onclick  = () => setView("list");
  let t;
  document.getElementById("search").oninput = e => {
    clearTimeout(t);
    t = setTimeout(() => { state.q = e.target.value.trim(); renderAll(); }, 160);
  };
  const lt = document.getElementById("labelToggle");
  lt.onclick = () => { state.labels = !state.labels; lt.setAttribute("aria-pressed", state.labels); renderChart(); };
  const hd = document.getElementById("hideDone");
  hd.onclick = () => { state.hideDone = !state.hideDone; hd.setAttribute("aria-pressed", state.hideDone); renderAll(); };
  const setGroup = g => {
    state.group = g;
    document.getElementById("groupField").setAttribute("aria-pressed", g==="field");
    document.getElementById("groupLevel").setAttribute("aria-pressed", g==="level");
    renderList();
  };
  document.getElementById("groupField").onclick = () => setGroup("field");
  document.getElementById("groupLevel").onclick = () => setGroup("level");
  document.getElementById("progressBtn").onclick = openDrawer;
  document.getElementById("resetBtn").onclick = () => {
    if (!state.done.size) return;
    if (confirm("Clear all " + state.done.size + " checked concepts?")){ state.done.clear(); save(); renderAll(); }
  };
  document.addEventListener("keydown", e => {
    if (e.key !== "Escape") return;
    const m = document.getElementById("drawerMount");
    if (m.innerHTML) m.innerHTML = ""; else select(null);
  });
})();

load().then(() => { renderAll(); });
</script>
</body>
</html>
