<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atlas of Statistics</title>
<style>
  :root{
    --ink:#0A0E1A;
    --ink-2:#0E1424;
    --panel:#131A2C;
    --line:#212B45;
    --text:#DCE3F0;
    --dim:#8593B0;
    --gold:#F0B95E;
    --ready:#4FD1E0;
    --serif: "Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
    --sans: ui-sans-serif,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono: ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:
      radial-gradient(1200px 800px at 50% 30%, #131C33 0%, rgba(10,14,26,0) 70%),
      var(--ink);
    color:var(--text);
    font-family:var(--sans);
    font-size:14px;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit}
  button{font-family:inherit;color:inherit;cursor:pointer}

  /* ---------- masthead ---------- */
  .masthead{
    padding:22px 22px 0;
    max-width:1600px;margin:0 auto;
  }
  .mast-row{display:flex;align-items:flex-end;gap:20px;flex-wrap:wrap;justify-content:space-between}
  .wordmark{margin:0;font-family:var(--serif);font-size:31px;font-weight:400;letter-spacing:.01em;line-height:1.1}
  .wordmark em{font-style:italic;color:var(--gold)}
  .tagline{margin:6px 0 0;color:var(--dim);font-size:12.5px;max-width:62ch}
  .counts{font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.06em;text-transform:uppercase}
  .counts b{color:var(--gold);font-weight:600}

  .progress-shell{display:flex;align-items:center;gap:14px}
  .dial{width:64px;height:64px;flex:0 0 auto}
  .dial-num{font-family:var(--mono);font-size:15px;fill:var(--gold)}
  .dial-lab{font-family:var(--mono);font-size:7px;fill:var(--dim);letter-spacing:.14em}

  /* ---------- controls ---------- */
  .controls{
    max-width:1600px;margin:18px auto 0;padding:0 22px;
    display:flex;gap:10px;flex-wrap:wrap;align-items:center;
  }
  .seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden;background:var(--ink-2)}
  .seg button{background:none;border:0;padding:7px 16px;font-size:12.5px;color:var(--dim);letter-spacing:.02em}
  .seg button[aria-pressed="true"]{background:var(--gold);color:#16110A;font-weight:600}
  .chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  .chip{
    background:var(--ink-2);border:1px solid var(--line);border-radius:999px;
    padding:6px 12px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--dim);
    display:inline-flex;align-items:center;gap:7px;
  }
  .chip[aria-pressed="true"]{color:var(--text);border-color:#3A4car}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;opacity:.5}
  .chip[aria-pressed="true"] .dot{opacity:1}
  .chip .n{opacity:.55;font-size:10px}
  .lvl-1[aria-pressed="true"]{border-color:#5B7ACF;color:#BFD0FF}
  .lvl-2[aria-pressed="true"]{border-color:#4FA8C7;color:#B7E4F5}
  .lvl-3[aria-pressed="true"]{border-color:#5CB98A;color:#BCEBD1}
  .lvl-4[aria-pressed="true"]{border-color:#C99A4E;color:#F3D9A8}
  .lvl-5[aria-pressed="true"]{border-color:#C0644F;color:#F5BDAE}
  .search{
    background:var(--ink-2);border:1px solid var(--line);border-radius:999px;color:var(--text);
    padding:7px 14px;font-size:12.5px;min-width:180px;outline:none;
  }
  .search:focus{border-color:var(--gold)}
  .ghost{background:var(--ink-2);border:1px solid var(--line);border-radius:999px;padding:6px 13px;font-size:12px;color:var(--dim)}
  .ghost:hover{color:var(--text);border-color:#33405F}
  .ghost[aria-pressed="true"]{color:var(--gold);border-color:#5A4A28}

  /* ---------- stage ---------- */
  .stage{max-width:1600px;margin:14px auto 0;padding:0 22px 40px;display:grid;grid-template-columns:1fr 330px;gap:18px;align-items:start}
  .stage.solo{grid-template-columns:1fr}
  .chartwrap{
    position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;
    background:radial-gradient(900px 700px at 50% 50%, #10182C 0%, #090D18 78%);
    height:min(78vh,860px);
  }
  #chart{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
  #chart.grabbing{cursor:grabbing}
  .zoombar{position:absolute;left:12px;bottom:12px;display:flex;gap:6px}
  .zoombar button{
    width:30px;height:30px;border-radius:8px;background:rgba(19,26,44,.85);border:1px solid var(--line);
    font-size:14px;line-height:1;color:var(--dim);display:grid;place-items:center;backdrop-filter:blur(4px);
  }
  .zoombar button.wide{width:auto;padding:0 10px;font-size:11px;font-family:var(--mono);letter-spacing:.06em}
  .legend{
    position:absolute;right:12px;top:12px;background:rgba(12,17,30,.82);border:1px solid var(--line);
    border-radius:10px;padding:10px 12px;backdrop-filter:blur(6px);max-width:215px;
    max-height:calc(100% - 24px);overflow:auto;
  }
  .legend .quick{display:flex;gap:4px;margin-top:9px;padding-top:8px;border-top:1px solid var(--line)}
  .legend .quick button{flex:1;background:var(--ink-2);border:1px solid var(--line);border-radius:6px;padding:4px 2px;font-size:10px;color:var(--dim)}
  .legend .quick button:hover{color:var(--text)}
  .legend h4{margin:0 0 7px;font-family:var(--mono);font-size:9.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:500}
  .legend .row{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--dim);padding:1.5px 0;cursor:pointer}
  .legend .row:hover{color:var(--text)}
  .legend .row.off{opacity:.32}
  .legend .sw{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .key{position:absolute;left:12px;top:12px;font-family:var(--mono);font-size:10px;color:var(--dim);line-height:1.9}
  .key i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:-1px}

  /* ---------- detail panel ---------- */
  .panel{border:1px solid var(--line);border-radius:14px;background:var(--panel);padding:16px;position:sticky;top:16px}
  .panel .eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .panel h3{margin:8px 0 4px;font-family:var(--serif);font-size:20px;font-weight:400;line-height:1.2}
  .panel .note{color:var(--dim);font-size:12.5px;margin:8px 0 14px}
  .panel h5{margin:14px 0 6px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500}
  .linklist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:5px}
  .linklist button{
    background:var(--ink-2);border:1px solid var(--line);border-radius:7px;padding:4px 8px;font-size:11.5px;color:var(--dim);text-align:left
  }
  .linklist button:hover{color:var(--text);border-color:#38466A}
  .linklist button.done{color:var(--gold);border-color:#4A3C1E}
  .markbtn{
    width:100%;margin-top:16px;padding:10px;border-radius:9px;border:1px solid var(--line);
    background:var(--ink-2);font-size:13px;letter-spacing:.02em;
  }
  .markbtn.on{background:var(--gold);color:#16110A;border-color:var(--gold);font-weight:600}
  .empty{color:var(--dim);font-size:12.5px}

  /* ---------- checklist ---------- */
  .list-view{max-width:1600px;margin:14px auto 0;padding:0 22px 60px}
  .ready-strip{border:1px solid #2A3E52;background:linear-gradient(180deg,#101E28,#0D141F);border-radius:14px;padding:14px 16px;margin-bottom:22px}
  .ready-strip h4{margin:0 0 3px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ready)}
  .ready-strip p{margin:0 0 10px;font-size:12px;color:var(--dim)}
  .ready-items{display:flex;flex-wrap:wrap;gap:6px}
  .ready-items button{background:rgba(79,209,224,.08);border:1px solid #2B4A56;border-radius:7px;padding:5px 10px;font-size:12px;color:#BFECF2}
  .ready-items button:hover{background:rgba(79,209,224,.18)}

  .lvl-block{margin-bottom:34px}
  .lvl-head{display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:4px}
  .lvl-num{font-family:var(--serif);font-size:34px;line-height:1;color:var(--gold);font-style:italic;min-width:34px}
  .lvl-name{font-family:var(--serif);font-size:19px}
  .lvl-desc{color:var(--dim);font-size:12px;flex:1 1 260px}
  .bar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:10px 0 16px}
  .bar i{display:block;height:100%;background:var(--gold);transition:width .35s ease}

  .dom-group{margin:0 0 18px}
  .dom-head{display:flex;align-items:center;gap:8px;margin:0 0 8px;font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)}
  .dom-head .sw{width:9px;height:9px;border-radius:2px}
  .dom-head .frac{margin-left:auto;font-size:10px;opacity:.75}
  .items{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:7px}
  .item{
    display:flex;gap:10px;align-items:flex-start;background:var(--ink-2);border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;text-align:left;width:100%;
  }
  .item:hover{border-color:#36446A}
  .item .box{
    width:15px;height:15px;border-radius:4px;border:1.5px solid #46557D;flex:0 0 auto;margin-top:2px;
    display:grid;place-items:center;font-size:10px;color:transparent;
  }
  .item.done{border-color:#4A3C1E;background:linear-gradient(180deg,#1B1710,#12100B)}
  .item.done .box{background:var(--gold);border-color:var(--gold);color:#16110A}
  .item.done .t{color:var(--gold)}
  .item.ready .box{border-color:var(--ready);box-shadow:0 0 0 3px rgba(79,209,224,.11)}
  .item .t{font-size:13px;line-height:1.35}
  .item .d{font-size:11.5px;color:var(--dim);margin-top:2px}
  .item .needs{font-size:10.5px;color:#6E7C99;margin-top:4px;font-family:var(--mono)}
  .item.done .d,.item.done .needs{opacity:.5}

  /* step ordering + field view */
  .item .step{font-family:var(--mono);font-size:10px;color:#5D6A85;flex:0 0 auto;margin-top:3px;min-width:20px;text-align:right}
  .item.done .step{color:#8A7440}
  .item .lvtag{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:#5D6A85;border:1px solid var(--line);border-radius:4px;padding:0 4px;margin-left:6px;vertical-align:1px}
  .field-block{margin-bottom:34px}
  .field-head{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding-bottom:9px;margin-bottom:12px;flex-wrap:wrap}
  .field-head .sw{width:11px;height:11px;flex:0 0 auto}
  .field-head h3{margin:0;font-family:var(--serif);font-size:20px;font-weight:400}
  .field-head .kind{font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:2px 8px}
  .field-head .counts{margin-left:auto}
  .seq{display:grid;gap:7px}
  .seq .item{max-width:none}

  /* progress drawer */
  .scrim{position:fixed;inset:0;background:rgba(5,8,15,.72);backdrop-filter:blur(3px);display:grid;place-items:center;padding:20px;z-index:40}
  .drawer{background:var(--panel);border:1px solid var(--line);border-radius:16px;max-width:660px;width:100%;max-height:86vh;overflow:auto;padding:22px}
  .drawer h2{margin:0 0 2px;font-family:var(--serif);font-size:23px;font-weight:400}
  .drawer .sub{color:var(--dim);font-size:12.5px;margin:0 0 18px}
  .drawer h5{margin:20px 0 8px;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);font-weight:500}
  .minibars{display:grid;gap:6px}
  .minirow{display:grid;grid-template-columns:132px 1fr 54px;gap:10px;align-items:center;font-size:12px}
  .minirow .track{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
  .minirow .track i{display:block;height:100%;border-radius:3px}
  .minirow .num{font-family:var(--mono);font-size:10.5px;color:var(--dim);text-align:right}
  .spark{width:100%;height:70px;border:1px solid var(--line);border-radius:9px;background:var(--ink-2)}
  .drawer textarea{width:100%;height:88px;background:var(--ink);border:1px solid var(--line);border-radius:9px;color:var(--text);font-family:var(--mono);font-size:11px;padding:9px;resize:vertical}
  .drawer .btnrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:9px}
  .drawer .btnrow button{background:var(--ink-2);border:1px solid var(--line);border-radius:9px;padding:8px 13px;font-size:12.5px;color:var(--text)}
  .drawer .btnrow button:hover{border-color:#3A4568}
  .drawer .btnrow button.primary{background:var(--gold);color:#16110A;border-color:var(--gold);font-weight:600}
  .drawer .close{float:right;background:none;border:0;color:var(--dim);font-size:20px;line-height:1;padding:0 2px}
  .msg{font-size:11.5px;color:var(--ready);min-height:16px;margin-top:6px}

  .foot{max-width:1600px;margin:0 auto;padding:0 22px 50px;color:#5D6A85;font-size:11.5px;font-family:var(--mono)}
  .saving{position:fixed;right:14px;bottom:14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:6px 11px;font-family:var(--mono);font-size:10.5px;color:var(--dim);opacity:0;transition:opacity .25s;pointer-events:none}
  .saving.show{opacity:1}
  .hidden{display:none !important}

  @media (max-width:980px){
    .stage{grid-template-columns:1fr}
    .panel{position:static}
    .chartwrap{height:64vh}
    .legend{display:none}
    .wordmark{font-size:25px}
    .items{grid-template-columns:1fr}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>

<header class="masthead">
  <div class="mast-row">
    <div>
      <h1 class="wordmark">Atlas of <em>Statistics</em></h1>
      <p class="tagline"><span id="tot">0</span> concepts, wired by what you need to know first. Rings are difficulty, wedges are fields, circles are statistics and squares are the craft that grew around it.</p>
    </div>
    <div class="progress-shell">
      <svg class="dial" viewBox="0 0 64 64" aria-hidden="true">
        <circle cx="32" cy="32" r="26" fill="none" stroke="#212B45" stroke-width="5"/>
        <circle id="dialArc" cx="32" cy="32" r="26" fill="none" stroke="#F0B95E" stroke-width="5"
                stroke-linecap="round" stroke-dasharray="0 999" transform="rotate(-90 32 32)"/>
        <text id="dialNum" class="dial-num" x="32" y="34" text-anchor="middle">0%</text>
        <text class="dial-lab" x="32" y="44" text-anchor="middle">MASTERED</text>
      </svg>
      <div class="counts" id="counts">0 of 319 complete</div>
    </div>
  </div>
</header>

<div class="controls">
  <div class="seg" role="group" aria-label="View">
    <button id="viewChart" aria-pressed="true">Star chart</button>
    <button id="viewList" aria-pressed="false">Checklist</button>
  </div>
  <div class="chips" id="levelChips"></div>
  <input class="search" id="search" type="search" placeholder="Search concepts" autocomplete="off">
  <button class="ghost" id="labelToggle" aria-pressed="false">Show all labels</button>
  <button class="ghost" id="hideDone" aria-pressed="false">Hide completed</button>
  <button class="ghost" id="progressBtn">Progress &amp; backup</button>
  <button class="ghost" id="resetBtn">Reset progress</button>
</div>

<main class="stage" id="stage">
  <div class="chartwrap" id="chartwrap">
    <svg id="chart" role="img" aria-label="Radial map of statistics concepts"></svg>
    <div class="key">
      <div><i style="background:#F0B95E"></i>mastered</div>
      <div><i style="background:transparent;border:1.5px solid #4FD1E0"></i>ready to start</div>
      <div><i style="background:#2A3350"></i>locked by prerequisites</div>
      <div style="margin-top:6px;opacity:.8"><i style="background:#8593B0"></i>core statistics</div>
      <div style="opacity:.8"><i style="background:#8593B0;border-radius:3px"></i>data science craft</div>
    </div>
    <div class="legend" id="legend"><h4>Fields</h4></div>
    <div class="zoombar">
      <button id="zoomIn" title="Zoom in">+</button>
      <button id="zoomOut" title="Zoom out">&minus;</button>
      <button id="zoomFit" class="wide" title="Reset view">FIT</button>
    </div>
  </div>
  <aside class="panel" id="panel"></aside>
</main>

<section class="list-view hidden" id="listView">
  <div class="seg" id="groupSeg" role="group" aria-label="Checklist grouping" style="margin-bottom:18px">
    <button id="groupField" aria-pressed="true">Step by step, by field</button>
    <button id="groupLevel" aria-pressed="false">Grouped by level</button>
  </div>
  <div id="listBody"></div>
</section>
<div id="drawerMount"></div>

<div class="foot" id="foot"></div>
<div class="saving" id="saving">saved</div>

<script>
const DATA = [{"id":"set-theory","label":"Set theory & notation","level":1,"domain":"math","prereqs":[],"note":"Unions, intersections, complements, partitions. Every probability rule is a set rule in disguise."},{"id":"combinatorics","label":"Combinatorics","level":1,"domain":"math","prereqs":["set-theory"],"note":"Permutations, combinations, multiplication rule. Foundation for discrete probability."},{"id":"functions-notation","label":"Functions & math notation","level":1,"domain":"math","prereqs":[],"note":"Domain, range, composition, inverse, logs and exponentials, sigma and pi notation."},{"id":"limits-continuity","label":"Limits & continuity","level":2,"domain":"math","prereqs":["functions-notation"],"note":"What 'approaches' means. Needed for asymptotics and for density as a limit of histograms."},{"id":"derivatives","label":"Derivatives","level":2,"domain":"math","prereqs":["limits-continuity"],"note":"Rates of change, chain rule, partial derivatives. The engine of every optimizer."},{"id":"integrals","label":"Integrals","level":2,"domain":"math","prereqs":["limits-continuity"],"note":"Area under a curve. Continuous probability is integration over a density."},{"id":"optimization-calculus","label":"Optimization (first & second order)","level":3,"domain":"math","prereqs":["derivatives"],"note":"Setting gradients to zero, Hessians, constrained optimization with Lagrange multipliers."},{"id":"multivariable-calculus","label":"Multivariable calculus","level":3,"domain":"math","prereqs":["derivatives","integrals"],"note":"Gradients, Jacobians, double integrals. Required for joint densities and MLE in many parameters."},{"id":"vectors-matrices","label":"Vectors & matrix algebra","level":2,"domain":"math","prereqs":["functions-notation"],"note":"Dot products, matrix multiply, transpose, inverse. Regression is linear algebra."},{"id":"linear-independence-rank","label":"Rank, span & linear independence","level":3,"domain":"math","prereqs":["vectors-matrices"],"note":"Explains multicollinearity, identifiability, and why a design matrix can be singular."},{"id":"quadratic-forms","label":"Quadratic forms & positive definiteness","level":3,"domain":"math","prereqs":["vectors-matrices"],"note":"x'Ax shows up in variance of linear combinations, Mahalanobis distance, and normal densities."},{"id":"matrix-decomposition","label":"Eigen, SVD & Cholesky","level":3,"domain":"math","prereqs":["vectors-matrices","linear-independence-rank"],"note":"Decompositions behind PCA, whitening, sampling correlated normals, and stable solvers."},{"id":"convex-optimization","label":"Convex optimization","level":4,"domain":"math","prereqs":["optimization-calculus","multivariable-calculus"],"note":"Convex sets and functions, duality, KKT. Why lasso, ridge, and SVM have reliable solutions."},{"id":"numerical-linear-algebra","label":"Numerical stability & conditioning","level":4,"domain":"math","prereqs":["matrix-decomposition"],"note":"QR instead of normal equations, condition numbers, floating point traps in real pipelines."},{"id":"measure-theory","label":"Measure theory","level":5,"domain":"math","prereqs":["set-theory","integrals"],"note":"Sigma-algebras, measurable functions, Lebesgue integration. The rigorous floor under probability."},{"id":"sample-space","label":"Random experiments & sample space","level":1,"domain":"prob","prereqs":["set-theory"],"note":"Outcomes, events, and the difference between an event and its probability."},{"id":"probability-axioms","label":"Probability axioms","level":1,"domain":"prob","prereqs":["sample-space"],"note":"Non-negativity, total mass one, additivity. Everything else is derived from these three."},{"id":"counting-rules","label":"Counting & equally likely outcomes","level":1,"domain":"prob","prereqs":["combinatorics","probability-axioms"],"note":"Classical probability problems: birthdays, poker hands, sampling with and without replacement."},{"id":"conditional-probability","label":"Conditional probability","level":2,"domain":"prob","prereqs":["probability-axioms"],"note":"P(A|B) as restricting the sample space. The single most misused idea in applied work."},{"id":"joint-probability","label":"Joint probability","level":2,"domain":"prob","prereqs":["probability-axioms","conditional-probability"],"note":"Probability over two or more variables at once, and the chain rule of probability."},{"id":"marginal-probability","label":"Marginal probability","level":2,"domain":"prob","prereqs":["joint-probability"],"note":"Summing or integrating a joint down to one variable. Marginalization is everywhere in Bayes."},{"id":"independence","label":"Independence & conditional independence","level":2,"domain":"prob","prereqs":["conditional-probability","joint-probability"],"note":"Independence is an assumption, not a default. Conditional independence powers naive Bayes and DAGs."},{"id":"law-total-probability","label":"Law of total probability","level":2,"domain":"prob","prereqs":["conditional-probability","marginal-probability"],"note":"Break a probability into cases over a partition. The denominator of Bayes' rule."},{"id":"bayes-theorem","label":"Bayes' theorem","level":2,"domain":"prob","prereqs":["conditional-probability","joint-probability","law-total-probability"],"note":"Invert a conditional. Base rates, false positive puzzles, and the root of Bayesian inference."},{"id":"random-variables","label":"Random variables","level":2,"domain":"prob","prereqs":["probability-axioms"],"note":"A function from outcomes to numbers. Discrete versus continuous, and why the distinction matters."},{"id":"pmf-pdf","label":"PMF & PDF","level":2,"domain":"prob","prereqs":["random-variables","integrals"],"note":"Mass versus density. A density value is not a probability."},{"id":"cdf","label":"CDF & survival function","level":2,"domain":"prob","prereqs":["random-variables"],"note":"F(x) = P(X <= x). The universal description that works for any random variable."},{"id":"quantile-function","label":"Quantile function","level":3,"domain":"prob","prereqs":["cdf"],"note":"Inverse CDF. Basis for percentiles, QQ plots, inverse transform sampling, and quantile regression."},{"id":"expectation","label":"Expectation","level":2,"domain":"prob","prereqs":["pmf-pdf"],"note":"Long-run average, linearity of expectation, expectation of a function of a random variable."},{"id":"variance-moments","label":"Variance & higher moments","level":2,"domain":"prob","prereqs":["expectation"],"note":"Spread, standard deviation, the variance of a sum, and what moments actually summarize."},{"id":"covariance-correlation","label":"Covariance & correlation","level":2,"domain":"prob","prereqs":["expectation","joint-probability"],"note":"Linear co-movement, scale invariance of correlation, and why zero correlation is not independence."},{"id":"conditional-expectation","label":"Conditional expectation","level":3,"domain":"prob","prereqs":["conditional-probability","expectation"],"note":"E[Y|X] is the best predictor under squared loss. Regression is an estimate of this object."},{"id":"iterated-expectation","label":"Iterated expectation & variance decomposition","level":4,"domain":"prob","prereqs":["conditional-expectation","variance-moments"],"note":"Tower rule and the law of total variance. Splits variance into within and between components."},{"id":"transformations-rv","label":"Transformations of random variables","level":3,"domain":"prob","prereqs":["random-variables","cdf","derivatives"],"note":"CDF method and the Jacobian change of variables. Explains lognormal, chi-square, and log transforms."},{"id":"mgf","label":"Moment generating functions","level":4,"domain":"prob","prereqs":["expectation","integrals"],"note":"Generates moments and proves distributions of sums. The clean way to derive many results."},{"id":"inequalities","label":"Markov & Chebyshev inequalities","level":3,"domain":"prob","prereqs":["expectation","variance-moments"],"note":"Distribution-free tail bounds. The stepping stone to the law of large numbers."},{"id":"jensen","label":"Jensen's inequality","level":4,"domain":"prob","prereqs":["expectation","convex-optimization"],"note":"E[g(X)] versus g(E[X]). Explains bias in log-transformed metrics and the ELBO in variational inference."},{"id":"convergence-concepts","label":"Modes of convergence","level":4,"domain":"prob","prereqs":["inequalities","limits-continuity"],"note":"In probability, almost surely, in distribution, in mean square. Asymptotics needs the vocabulary."},{"id":"lln","label":"Law of large numbers","level":3,"domain":"prob","prereqs":["expectation","inequalities"],"note":"Sample means converge to the truth. Why sampling and Monte Carlo work at all."},{"id":"clt","label":"Central limit theorem","level":3,"domain":"prob","prereqs":["lln","variance-moments"],"note":"Standardized sums go normal. The reason so many tests use the normal or t distribution."},{"id":"delta-method","label":"Delta method","level":4,"domain":"prob","prereqs":["clt","derivatives"],"note":"Standard errors for nonlinear functions of estimates, like ratios, odds ratios, and lift."},{"id":"slutsky","label":"Slutsky's theorem & continuous mapping","level":5,"domain":"prob","prereqs":["convergence-concepts"],"note":"Lets you swap in consistent estimates of nuisance parameters without breaking asymptotics."},{"id":"order-statistics","label":"Order statistics","level":4,"domain":"prob","prereqs":["cdf","transformations-rv"],"note":"Distribution of the min, max, and quantiles. Underlies extreme value work and rank methods."},{"id":"entropy","label":"Entropy & mutual information","level":3,"domain":"prob","prereqs":["expectation","pmf-pdf"],"note":"Uncertainty measured in bits. Splitting criterion for trees and a model-free dependence measure."},{"id":"kl-divergence","label":"KL divergence & cross-entropy","level":4,"domain":"prob","prereqs":["entropy"],"note":"Distance between distributions. Maximum likelihood is minimizing KL to the empirical distribution."},{"id":"stochastic-processes","label":"Stochastic processes","level":4,"domain":"prob","prereqs":["random-variables","conditional-expectation"],"note":"Collections of random variables indexed by time. Formal home for time series and queues."},{"id":"markov-chains","label":"Markov chains","level":4,"domain":"prob","prereqs":["stochastic-processes","conditional-probability"],"note":"Memoryless transitions, stationary distributions, ergodicity. The theory that makes MCMC valid."},{"id":"poisson-process","label":"Poisson process","level":4,"domain":"prob","prereqs":["stochastic-processes","poisson-dist"],"note":"Arrivals in continuous time. Models clicks, failures, and traffic in production systems."},{"id":"martingales","label":"Martingales & optional stopping","level":5,"domain":"prob","prereqs":["conditional-expectation","stochastic-processes"],"note":"Fair-game processes. The basis for valid sequential testing and peeking-safe experiment analysis."},{"id":"copulas","label":"Copulas","level":5,"domain":"prob","prereqs":["joint-probability","quantile-function"],"note":"Separates marginals from dependence structure. Used in risk modeling and tail dependence."},{"id":"measure-probability","label":"Measure-theoretic probability","level":5,"domain":"prob","prereqs":["measure-theory","random-variables"],"note":"Probability spaces, Radon-Nikodym derivatives, rigorous conditional expectation."},{"id":"bernoulli","label":"Bernoulli","level":2,"domain":"dist","prereqs":["random-variables"],"note":"One trial, two outcomes. The atom of conversion, click, and churn modeling."},{"id":"binomial","label":"Binomial","level":2,"domain":"dist","prereqs":["bernoulli","counting-rules"],"note":"Counts of successes in n independent trials. The workhorse for proportion tests."},{"id":"geometric-negbinom","label":"Geometric & negative binomial","level":3,"domain":"dist","prereqs":["bernoulli"],"note":"Trials until success, and overdispersed counts when Poisson variance is too small."},{"id":"hypergeometric","label":"Hypergeometric","level":3,"domain":"dist","prereqs":["counting-rules"],"note":"Sampling without replacement. Powers Fisher's exact test and enrichment analysis."},{"id":"poisson-dist","label":"Poisson","level":2,"domain":"dist","prereqs":["binomial"],"note":"Rare event counts per unit of exposure. Mean equals variance, which is testable."},{"id":"multinomial","label":"Multinomial & categorical","level":3,"domain":"dist","prereqs":["binomial"],"note":"More than two categories. Behind chi-square tests and softmax classification."},{"id":"uniform","label":"Uniform","level":2,"domain":"dist","prereqs":["pmf-pdf"],"note":"Flat density. The source of all other random numbers via transformation."},{"id":"normal-dist","label":"Normal distribution","level":2,"domain":"dist","prereqs":["pmf-pdf"],"note":"Bell curve, z-scores, the 68-95-99.7 rule, and closure under linear combinations."},{"id":"exponential-dist","label":"Exponential","level":2,"domain":"dist","prereqs":["pmf-pdf"],"note":"Waiting times with a constant hazard, and the memoryless property."},{"id":"lognormal","label":"Lognormal","level":3,"domain":"dist","prereqs":["normal-dist","transformations-rv"],"note":"Right-skewed positive quantities: revenue, session time, salaries. Log transform makes it normal."},{"id":"gamma-dist","label":"Gamma","level":3,"domain":"dist","prereqs":["exponential-dist","integrals"],"note":"Sum of exponentials, flexible positive-skew family, conjugate prior for Poisson rates."},{"id":"beta-dist","label":"Beta","level":3,"domain":"dist","prereqs":["gamma-dist"],"note":"Distribution on (0,1). Natural prior and posterior for a conversion rate."},{"id":"chi-square-dist","label":"Chi-square","level":3,"domain":"dist","prereqs":["normal-dist","gamma-dist"],"note":"Sum of squared standard normals. Null distribution for variance and goodness of fit."},{"id":"t-dist","label":"Student t","level":3,"domain":"dist","prereqs":["normal-dist","chi-square-dist"],"note":"Normal mean with estimated variance. Heavier tails at small sample sizes."},{"id":"f-dist","label":"F distribution","level":3,"domain":"dist","prereqs":["chi-square-dist"],"note":"Ratio of scaled chi-squares. Null distribution for ANOVA and nested model comparison."},{"id":"weibull","label":"Weibull & extreme value","level":4,"domain":"dist","prereqs":["exponential-dist","order-statistics"],"note":"Flexible hazard shapes for reliability, plus the limit laws for maxima."},{"id":"heavy-tails","label":"Power laws & heavy tails","level":4,"domain":"dist","prereqs":["cdf","variance-moments"],"note":"When means and variances are unstable or undefined. Common in engagement and revenue data."},{"id":"mixture-distributions","label":"Mixture distributions","level":4,"domain":"dist","prereqs":["pmf-pdf","law-total-probability"],"note":"Populations made of latent subgroups. Explains multimodality and zero-inflation."},{"id":"exponential-family","label":"Exponential family","level":4,"domain":"dist","prereqs":["mgf","normal-dist","gamma-dist"],"note":"Common structure with natural parameters and sufficient statistics. Unifies all GLMs."},{"id":"multivariate-normal","label":"Multivariate normal","level":4,"domain":"dist","prereqs":["normal-dist","covariance-correlation","quadratic-forms"],"note":"Mean vector and covariance matrix, marginals and conditionals stay normal. Core of many models."},{"id":"dirichlet","label":"Dirichlet","level":5,"domain":"dist","prereqs":["beta-dist","multinomial"],"note":"Distribution over probability vectors. Prior for multinomials and topic models."},{"id":"wishart","label":"Wishart & inverse Wishart","level":5,"domain":"dist","prereqs":["multivariate-normal","chi-square-dist"],"note":"Distribution over covariance matrices. Prior in hierarchical and multivariate Bayesian models."},{"id":"measurement-scales","label":"Data types & measurement scales","level":1,"domain":"eda","prereqs":[],"note":"Nominal, ordinal, interval, ratio. Decides which summary and which test is legitimate."},{"id":"central-tendency","label":"Mean, median, mode","level":1,"domain":"eda","prereqs":["measurement-scales"],"note":"When each one lies. Median for skew, mode for categories, trimmed mean for outliers."},{"id":"dispersion","label":"Range, variance, SD, IQR, CV","level":1,"domain":"eda","prereqs":["central-tendency"],"note":"Spread measures and which are robust. Coefficient of variation for cross-scale comparison."},{"id":"percentiles","label":"Percentiles & quantiles","level":1,"domain":"eda","prereqs":["dispersion"],"note":"p50, p90, p99. Latency and spend are almost always reported at tails, not means."},{"id":"univariate-viz","label":"Univariate plots","level":1,"domain":"eda","prereqs":["measurement-scales"],"note":"Histogram, density, box, violin, ECDF. Bin width and axis choices change the story."},{"id":"bivariate-viz","label":"Bivariate plots","level":2,"domain":"eda","prereqs":["univariate-viz"],"note":"Scatter, hexbin, faceting, small multiples. Look before you model."},{"id":"skew-kurtosis","label":"Skewness & kurtosis","level":2,"domain":"eda","prereqs":["variance-moments","dispersion"],"note":"Shape beyond center and spread, and why they warn you about mean-based methods."},{"id":"outliers","label":"Outlier detection","level":2,"domain":"eda","prereqs":["percentiles","dispersion"],"note":"IQR fences, z-scores, robust MAD. Deciding to drop a point is a modeling choice."},{"id":"correlation-analysis","label":"Correlation analysis","level":2,"domain":"eda","prereqs":["covariance-correlation","bivariate-viz"],"note":"Pearson r, correlation matrices, Anscombe's quartet, attenuation from noise and range restriction."},{"id":"rank-correlation","label":"Spearman & Kendall","level":3,"domain":"eda","prereqs":["correlation-analysis","rank-methods"],"note":"Monotonic association without a linearity assumption. Robust to outliers and skew."},{"id":"contingency-tables","label":"Contingency tables","level":2,"domain":"eda","prereqs":["joint-probability","measurement-scales"],"note":"Cross-tabs, row and column percentages, marginal versus conditional distributions."},{"id":"simpsons-paradox","label":"Simpson's paradox & aggregation bias","level":3,"domain":"eda","prereqs":["contingency-tables","conditional-probability"],"note":"Aggregate trends can reverse within subgroups. Interview favorite and a real reporting hazard."},{"id":"data-cleaning","label":"Data cleaning & validation","level":1,"domain":"eda","prereqs":["measurement-scales"],"note":"Types, duplicates, ranges, referential checks, unit errors. Most analysis failures start here."},{"id":"missing-data","label":"Missing data mechanisms","level":3,"domain":"eda","prereqs":["data-cleaning","conditional-probability"],"note":"MCAR, MAR, MNAR. The mechanism decides whether dropping rows biases your answer."},{"id":"imputation","label":"Imputation methods","level":4,"domain":"eda","prereqs":["missing-data","multiple-regression"],"note":"Mean, regression, hot deck, MICE, and why multiple imputation fixes understated uncertainty."},{"id":"feature-transforms","label":"Scaling & transformations","level":2,"domain":"eda","prereqs":["univariate-viz","functions-notation"],"note":"Log, sqrt, Box-Cox, standardizing, binning. Fixes skew and puts variables on comparable scales."},{"id":"eda-workflow","label":"Structured EDA workflow","level":2,"domain":"eda","prereqs":["univariate-viz","data-cleaning"],"note":"A repeatable order of operations so you notice problems before they reach a model or a slide."},{"id":"population-sample","label":"Population vs sample","level":1,"domain":"est","prereqs":["measurement-scales"],"note":"Parameter versus statistic, target population versus frame. The first question in any study."},{"id":"sampling-methods","label":"Sampling designs","level":2,"domain":"est","prereqs":["population-sample","probability-axioms"],"note":"Simple random, stratified, cluster, systematic, multistage, and how each affects variance."},{"id":"sampling-bias","label":"Sampling bias & nonresponse","level":2,"domain":"est","prereqs":["sampling-methods"],"note":"Coverage, selection, survivorship, self-selection. Bigger n does not fix a biased frame."},{"id":"sampling-distribution","label":"Sampling distribution","level":3,"domain":"est","prereqs":["sampling-methods","random-variables","clt"],"note":"The distribution of a statistic across hypothetical repeated samples. The key mental model."},{"id":"standard-error","label":"Standard error","level":3,"domain":"est","prereqs":["sampling-distribution"],"note":"SD of an estimator, not of the data. Root-n scaling and what it means for sample size."},{"id":"point-estimation","label":"Point estimation","level":3,"domain":"est","prereqs":["sampling-distribution"],"note":"Estimator versus estimate. Properties you should always ask about before trusting a number."},{"id":"bias-variance-estimator","label":"Bias, variance & MSE of estimators","level":3,"domain":"est","prereqs":["point-estimation","expectation"],"note":"MSE splits into bias squared plus variance. Sometimes a biased estimator wins."},{"id":"consistency-efficiency","label":"Consistency & efficiency","level":4,"domain":"est","prereqs":["bias-variance-estimator","convergence-concepts"],"note":"Does the estimator converge, and does it use the data as well as possible."},{"id":"method-of-moments","label":"Method of moments","level":3,"domain":"est","prereqs":["variance-moments","point-estimation"],"note":"Match sample moments to population moments. Simple, fast, often a good starting value."},{"id":"mle","label":"Maximum likelihood estimation","level":3,"domain":"est","prereqs":["pmf-pdf","optimization-calculus","independence"],"note":"Pick parameters that make the observed data most probable. The default estimator in modern stats."},{"id":"sufficiency","label":"Sufficiency & likelihood principle","level":5,"domain":"est","prereqs":["mle","exponential-family"],"note":"Statistics that carry all the information about a parameter. Factorization theorem."},{"id":"fisher-information","label":"Fisher information","level":5,"domain":"est","prereqs":["mle","derivatives"],"note":"Curvature of the log-likelihood. More curvature means more precision, and it gives the SEs."},{"id":"cramer-rao","label":"Cramer-Rao lower bound","level":5,"domain":"est","prereqs":["fisher-information"],"note":"A floor on the variance of any unbiased estimator. Defines what efficient means."},{"id":"asymptotic-mle","label":"Asymptotic normality of MLE","level":5,"domain":"est","prereqs":["mle","clt","fisher-information"],"note":"Why almost every model reports estimate plus or minus 1.96 standard errors."},{"id":"confidence-intervals","label":"Confidence intervals","level":3,"domain":"est","prereqs":["standard-error","sampling-distribution"],"note":"Coverage is a property of the procedure, not of one interval. Say it correctly in interviews."},{"id":"finite-population","label":"Finite population correction & weights","level":4,"domain":"est","prereqs":["sampling-methods","standard-error"],"note":"Design weights, post-stratification, raking. Essential for survey and institutional data."},{"id":"bootstrap","label":"Bootstrap","level":3,"domain":"est","prereqs":["sampling-distribution","monte-carlo"],"note":"Resample the data to approximate the sampling distribution. Percentile, basic, and BCa intervals."},{"id":"jackknife","label":"Jackknife & influence","level":4,"domain":"est","prereqs":["bootstrap"],"note":"Leave-one-out resampling for bias and variance, and a link to influence functions."},{"id":"shrinkage-estimation","label":"Shrinkage & Stein estimation","level":5,"domain":"est","prereqs":["bias-variance-estimator","hierarchical-bayes"],"note":"Pulling noisy group estimates toward the grand mean beats separate estimates. Basis of partial pooling."},{"id":"hypothesis-framework","label":"Hypothesis testing framework","level":2,"domain":"inf","prereqs":["probability-axioms","population-sample"],"note":"Assume the null, compute a statistic, ask how surprising the data are under that assumption."},{"id":"null-alternative","label":"Null & alternative hypotheses","level":2,"domain":"inf","prereqs":["hypothesis-framework"],"note":"One-sided versus two-sided, and writing hypotheses about parameters rather than about data."},{"id":"test-statistic","label":"Test statistics & null distributions","level":3,"domain":"inf","prereqs":["null-alternative","sampling-distribution"],"note":"A statistic is only meaningful against its distribution under the null."},{"id":"p-value","label":"p-values","level":3,"domain":"inf","prereqs":["test-statistic"],"note":"P(data this extreme or more | null true). Not the probability the null is true."},{"id":"type-errors","label":"Type I & Type II error","level":3,"domain":"inf","prereqs":["hypothesis-framework"],"note":"Alpha, beta, and the tradeoff. Frame decisions as costs of each mistake."},{"id":"power","label":"Statistical power","level":3,"domain":"inf","prereqs":["type-errors","standard-error"],"note":"Probability of detecting a real effect. Underpowered studies produce inflated published effects."},{"id":"effect-size","label":"Effect sizes","level":3,"domain":"inf","prereqs":["power","dispersion"],"note":"Cohen's d, odds ratio, lift, relative risk. Significance without magnitude is not a finding."},{"id":"sample-size","label":"Sample size & MDE calculation","level":3,"domain":"inf","prereqs":["power","effect-size"],"note":"Solve for n before launching. Minimum detectable effect is the number stakeholders care about."},{"id":"ci-vs-test","label":"Confidence intervals vs tests","level":3,"domain":"inf","prereqs":["confidence-intervals","p-value"],"note":"Duality between intervals and tests, and why intervals communicate better to decision makers."},{"id":"one-sample-t","label":"One-sample t test","level":3,"domain":"inf","prereqs":["t-dist","test-statistic"],"note":"Testing a mean with unknown variance. Know the assumptions and their robustness."},{"id":"two-sample-t","label":"Two-sample t test","level":3,"domain":"inf","prereqs":["one-sample-t"],"note":"Comparing two group means, pooled versus unpooled variance."},{"id":"welch","label":"Welch's correction","level":3,"domain":"inf","prereqs":["two-sample-t"],"note":"Unequal variances and fractional degrees of freedom. Usually the safer default."},{"id":"paired-t","label":"Paired t test","level":3,"domain":"inf","prereqs":["one-sample-t"],"note":"Within-subject comparisons. Pairing removes between-subject variance and raises power."},{"id":"proportion-tests","label":"Proportion & two-proportion z tests","level":3,"domain":"inf","prereqs":["binomial","clt","test-statistic"],"note":"The default test behind most conversion rate experiments."},{"id":"chi-square-tests","label":"Chi-square goodness of fit & independence","level":3,"domain":"inf","prereqs":["chi-square-dist","contingency-tables"],"note":"Expected counts, degrees of freedom, and the small-cell rule of thumb."},{"id":"fishers-exact","label":"Fisher's exact test","level":4,"domain":"inf","prereqs":["hypergeometric","chi-square-tests"],"note":"Exact inference for small tables where chi-square approximation breaks down."},{"id":"variance-tests","label":"Tests for variance & normality","level":4,"domain":"inf","prereqs":["chi-square-dist","f-dist"],"note":"Levene, Bartlett, Shapiro-Wilk. Useful, but do not let assumption tests drive everything."},{"id":"anova-one-way","label":"One-way ANOVA","level":3,"domain":"inf","prereqs":["f-dist","two-sample-t"],"note":"Partition variance between and within groups. The omnibus test before pairwise comparisons."},{"id":"anova-two-way","label":"Two-way ANOVA & interactions","level":4,"domain":"inf","prereqs":["anova-one-way"],"note":"Main effects versus interaction, and balanced versus unbalanced designs."},{"id":"ancova","label":"ANCOVA","level":4,"domain":"inf","prereqs":["anova-one-way","multiple-regression"],"note":"Adjust group comparisons for covariates. The classical cousin of regression adjustment."},{"id":"repeated-measures","label":"Repeated measures ANOVA","level":4,"domain":"inf","prereqs":["anova-two-way","paired-t"],"note":"Correlated observations within subject, sphericity, and when to move to mixed models."},{"id":"multiple-comparisons","label":"Multiple comparisons problem","level":4,"domain":"inf","prereqs":["p-value","type-errors"],"note":"Family-wise error rate, Bonferroni, Holm. Twenty metrics means at least one false positive."},{"id":"fdr","label":"False discovery rate","level":4,"domain":"inf","prereqs":["multiple-comparisons"],"note":"Benjamini-Hochberg. The realistic control target when you test hundreds of hypotheses."},{"id":"post-hoc","label":"Post-hoc tests","level":4,"domain":"inf","prereqs":["anova-one-way","multiple-comparisons"],"note":"Tukey HSD, Dunnett, Scheffe. Which pairwise comparison procedure fits which design."},{"id":"likelihood-ratio-test","label":"Likelihood ratio test","level":5,"domain":"inf","prereqs":["mle","chi-square-dist"],"note":"Compare nested models via the likelihood. Wilks' theorem gives the asymptotic null."},{"id":"wald-score","label":"Wald & score tests","level":5,"domain":"inf","prereqs":["fisher-information","likelihood-ratio-test"],"note":"The other two members of the asymptotic trinity, and when they disagree."},{"id":"neyman-pearson","label":"Neyman-Pearson lemma","level":5,"domain":"inf","prereqs":["likelihood-ratio-test","type-errors"],"note":"The most powerful test for a simple null versus simple alternative. Theory behind optimal tests."},{"id":"ump-tests","label":"Uniformly most powerful tests","level":5,"domain":"inf","prereqs":["neyman-pearson"],"note":"Monotone likelihood ratio and when a single test is optimal across all alternatives."},{"id":"permutation-tests","label":"Permutation & randomization tests","level":4,"domain":"inf","prereqs":["hypothesis-framework","monte-carlo"],"note":"Build the null by shuffling labels. Few assumptions and very defensible in experiments."},{"id":"equivalence-tost","label":"Equivalence & non-inferiority tests","level":4,"domain":"inf","prereqs":["ci-vs-test"],"note":"Proving something is not worse. Absence of significance is not evidence of equivalence."},{"id":"sequential-testing","label":"Sequential & group sequential testing","level":5,"domain":"inf","prereqs":["hypothesis-framework","martingales","peeking"],"note":"Alpha spending, SPRT, O'Brien-Fleming. Lets you stop early without inflating error."},{"id":"always-valid","label":"Always-valid inference & e-values","level":5,"domain":"inf","prereqs":["sequential-testing"],"note":"Confidence sequences that stay valid under continuous monitoring. Used in modern experiment platforms."},{"id":"replication-crisis","label":"p-hacking, garden of forking paths & reproducibility","level":4,"domain":"inf","prereqs":["p-value","multiple-comparisons"],"note":"Pre-registration, HARKing, publication bias, and how to keep your own analysis honest."},{"id":"rank-methods","label":"Ranks & rank transforms","level":3,"domain":"nonpar","prereqs":["percentiles","cdf"],"note":"Replace values with ranks to gain robustness to outliers and non-normality."},{"id":"mann-whitney","label":"Mann-Whitney U / Wilcoxon rank sum","level":3,"domain":"nonpar","prereqs":["rank-methods","two-sample-t"],"note":"Two-group comparison without normality. Tests stochastic dominance, not exactly medians."},{"id":"wilcoxon-signed","label":"Wilcoxon signed rank","level":3,"domain":"nonpar","prereqs":["rank-methods","paired-t"],"note":"Paired comparison for symmetric but non-normal differences."},{"id":"kruskal-wallis","label":"Kruskal-Wallis","level":4,"domain":"nonpar","prereqs":["mann-whitney","anova-one-way"],"note":"Rank-based analogue of one-way ANOVA across three or more groups."},{"id":"friedman","label":"Friedman test","level":4,"domain":"nonpar","prereqs":["kruskal-wallis","repeated-measures"],"note":"Rank-based repeated measures across blocks."},{"id":"ks-test","label":"Kolmogorov-Smirnov test","level":4,"domain":"nonpar","prereqs":["cdf","hypothesis-framework"],"note":"Compare two ECDFs or a sample to a reference. Widely reused for data drift detection."},{"id":"anderson-darling","label":"Anderson-Darling & Cramer-von Mises","level":4,"domain":"nonpar","prereqs":["ks-test"],"note":"Tail-sensitive alternatives to KS when the tails are what matter."},{"id":"kde","label":"Kernel density estimation","level":4,"domain":"nonpar","prereqs":["pmf-pdf","univariate-viz"],"note":"Smoothing a sample into a density. Bandwidth choice is the whole game."},{"id":"splines-loess","label":"Splines & LOESS","level":4,"domain":"nonpar","prereqs":["kde","multiple-regression"],"note":"Flexible curves without a global functional form. Knots, degrees of freedom, and smoothing penalties."},{"id":"bootstrap-hypothesis","label":"Bootstrap hypothesis tests","level":4,"domain":"nonpar","prereqs":["bootstrap","permutation-tests"],"note":"Resampling under the null for statistics with no clean analytic distribution."},{"id":"simple-regression","label":"Simple linear regression","level":2,"domain":"reg","prereqs":["correlation-analysis","bivariate-viz"],"note":"One predictor, slope and intercept, fitted values and residuals. Interpretation before mechanics."},{"id":"least-squares","label":"Least squares & the normal equations","level":3,"domain":"reg","prereqs":["simple-regression","vectors-matrices","optimization-calculus","conditional-expectation"],"note":"Minimize squared residuals, geometry of projection, the hat matrix."},{"id":"multiple-regression","label":"Multiple linear regression","level":3,"domain":"reg","prereqs":["least-squares"],"note":"Holding other variables constant, partial slopes, and the Frisch-Waugh intuition."},{"id":"dummy-coding","label":"Categorical predictors & encoding","level":2,"domain":"reg","prereqs":["measurement-scales","simple-regression"],"note":"Dummy variables, reference levels, the dummy variable trap, one-hot versus effect coding."},{"id":"regression-assumptions","label":"Regression assumptions","level":3,"domain":"reg","prereqs":["multiple-regression"],"note":"Linearity, independence, homoskedasticity, normal errors. Know which ones actually matter and when."},{"id":"residual-diagnostics","label":"Residual diagnostics","level":3,"domain":"reg","prereqs":["regression-assumptions"],"note":"Residual versus fitted, QQ plot, scale-location. Diagnose before you defend a model."},{"id":"r-squared","label":"R-squared, adjusted R-squared & F test","level":3,"domain":"reg","prereqs":["multiple-regression","f-dist"],"note":"Variance explained, why R-squared never decreases, and overall model significance."},{"id":"interpretation-inference","label":"Coefficient inference & interpretation","level":3,"domain":"reg","prereqs":["multiple-regression","confidence-intervals"],"note":"Standard errors, t tests, intervals for slopes, and units. The part interviewers probe hardest."},{"id":"multicollinearity","label":"Multicollinearity & VIF","level":3,"domain":"reg","prereqs":["multiple-regression","linear-independence-rank"],"note":"Correlated predictors inflate standard errors without hurting prediction."},{"id":"heteroskedasticity","label":"Heteroskedasticity","level":4,"domain":"reg","prereqs":["residual-diagnostics"],"note":"Non-constant error variance. Coefficients stay unbiased, standard errors do not."},{"id":"robust-se","label":"Robust & clustered standard errors","level":4,"domain":"reg","prereqs":["heteroskedasticity"],"note":"Huber-White sandwich estimators and clustering when observations group together."},{"id":"wls","label":"Weighted & generalized least squares","level":4,"domain":"reg","prereqs":["heteroskedasticity","quadratic-forms"],"note":"Reweight by known variance structure, including correlated errors."},{"id":"influence-leverage","label":"Leverage, influence & Cook's distance","level":4,"domain":"reg","prereqs":["residual-diagnostics","least-squares"],"note":"Which single rows are quietly driving your coefficients."},{"id":"gauss-markov","label":"Gauss-Markov theorem","level":4,"domain":"reg","prereqs":["least-squares","bias-variance-estimator"],"note":"OLS is BLUE under stated conditions. Understanding the conditions is the useful part."},{"id":"polynomial-interactions","label":"Nonlinear terms & interactions","level":3,"domain":"reg","prereqs":["multiple-regression","dummy-coding"],"note":"Polynomials, log-log elasticities, interaction terms, and centering to keep them interpretable."},{"id":"model-selection-criteria","label":"AIC, BIC & model selection","level":4,"domain":"reg","prereqs":["mle","r-squared"],"note":"Penalized likelihood, nested versus non-nested comparison, and the danger of stepwise selection."},{"id":"ridge","label":"Ridge regression","level":4,"domain":"reg","prereqs":["multiple-regression","convex-optimization","bias-variance-tradeoff"],"note":"L2 penalty trades a little bias for much lower variance under collinearity."},{"id":"lasso-elasticnet","label":"Lasso & elastic net","level":4,"domain":"reg","prereqs":["ridge"],"note":"L1 sparsity for selection, elastic net for correlated groups, and the regularization path."},{"id":"logistic-regression","label":"Logistic regression","level":3,"domain":"reg","prereqs":["multiple-regression","mle","bernoulli"],"note":"Log odds, odds ratios, separation, and why interpretation differs from linear regression."},{"id":"glm-framework","label":"Generalized linear models","level":4,"domain":"reg","prereqs":["logistic-regression","exponential-family"],"note":"Random component, link function, linear predictor. One framework for many response types."},{"id":"poisson-regression","label":"Poisson & rate regression","level":4,"domain":"reg","prereqs":["glm-framework","poisson-dist"],"note":"Counts with offsets for exposure, and testing for overdispersion."},{"id":"negbinom-regression","label":"Negative binomial & zero-inflated models","level":5,"domain":"reg","prereqs":["poisson-regression","geometric-negbinom","mixture-distributions"],"note":"Overdispersed and excess-zero counts, which real behavioral data produce constantly."},{"id":"ordinal-multinomial-reg","label":"Multinomial & ordinal regression","level":4,"domain":"reg","prereqs":["logistic-regression","multinomial"],"note":"More than two outcome classes, proportional odds, and its assumption."},{"id":"quantile-regression","label":"Quantile regression","level":5,"domain":"reg","prereqs":["quantile-function","convex-optimization","multiple-regression"],"note":"Model the median or p90 instead of the mean. Ideal for latency and income."},{"id":"nonlinear-regression","label":"Nonlinear least squares","level":4,"domain":"reg","prereqs":["optimization-calculus","multiple-regression"],"note":"Fitting curves with parameters inside a nonlinear function, including growth and decay models."},{"id":"gam","label":"Generalized additive models","level":5,"domain":"reg","prereqs":["splines-loess","glm-framework"],"note":"Smooth functions of each predictor with GLM structure. Flexible and still interpretable."},{"id":"mixed-models","label":"Mixed effects & multilevel models","level":5,"domain":"reg","prereqs":["multiple-regression","multivariate-normal","repeated-measures"],"note":"Random intercepts and slopes for nested data: students in schools, users in cities."},{"id":"gee","label":"Generalized estimating equations","level":5,"domain":"reg","prereqs":["glm-framework","mixed-models"],"note":"Population-averaged effects with a working correlation structure for clustered data."},{"id":"panel-fixed-effects","label":"Panel data & fixed effects","level":4,"domain":"reg","prereqs":["multiple-regression","robust-se"],"note":"Within versus between variation, entity and time fixed effects, and what they absorb."},{"id":"bayesian-thinking","label":"Bayesian thinking","level":3,"domain":"bayes","prereqs":["bayes-theorem"],"note":"Probability as belief about parameters. Contrast with the frequentist repeated sampling view."},{"id":"prior-likelihood-posterior","label":"Prior, likelihood, posterior","level":3,"domain":"bayes","prereqs":["bayesian-thinking","mle"],"note":"Posterior is proportional to likelihood times prior. Everything else is computation."},{"id":"conjugate-priors","label":"Conjugate priors","level":4,"domain":"bayes","prereqs":["prior-likelihood-posterior","beta-dist","gamma-dist"],"note":"Beta-binomial and gamma-Poisson give closed-form posteriors you can compute in your head."},{"id":"prior-choice","label":"Prior choice & sensitivity","level":4,"domain":"bayes","prereqs":["prior-likelihood-posterior"],"note":"Informative, weakly informative, and flat priors, plus checking how much the prior drives conclusions."},{"id":"credible-intervals","label":"Credible intervals & posterior summaries","level":4,"domain":"bayes","prereqs":["prior-likelihood-posterior","quantile-function"],"note":"A direct probability statement about a parameter, which is what stakeholders think a CI means."},{"id":"bayes-factors","label":"Bayes factors & model comparison","level":5,"domain":"bayes","prereqs":["prior-likelihood-posterior","likelihood-ratio-test"],"note":"Evidence ratios between models, marginal likelihoods, and their sensitivity to priors."},{"id":"mcmc","label":"MCMC fundamentals","level":5,"domain":"bayes","prereqs":["markov-chains","monte-carlo"],"note":"Sample from a posterior you cannot integrate. Burn-in, mixing, R-hat, effective sample size."},{"id":"metropolis","label":"Metropolis-Hastings","level":5,"domain":"bayes","prereqs":["mcmc"],"note":"Propose and accept or reject. The simplest general-purpose posterior sampler."},{"id":"gibbs","label":"Gibbs sampling","level":5,"domain":"bayes","prereqs":["mcmc","conditional-probability"],"note":"Cycle through full conditionals. Natural fit for hierarchical and conjugate structures."},{"id":"hmc","label":"Hamiltonian Monte Carlo & NUTS","level":5,"domain":"bayes","prereqs":["metropolis","multivariable-calculus"],"note":"Gradient-guided proposals. What Stan and PyMC actually run under the hood."},{"id":"variational-inference","label":"Variational inference","level":5,"domain":"bayes","prereqs":["kl-divergence","convex-optimization","jensen"],"note":"Approximate the posterior by optimization instead of sampling. Fast and scalable, but biased."},{"id":"hierarchical-bayes","label":"Hierarchical & partial pooling models","level":5,"domain":"bayes","prereqs":["conjugate-priors","mixed-models"],"note":"Share strength across groups. The right answer for small-sample per-segment estimates."},{"id":"empirical-bayes","label":"Empirical Bayes","level":5,"domain":"bayes","prereqs":["hierarchical-bayes","mle"],"note":"Estimate the prior from the data. Practical for ranking and rating systems."},{"id":"posterior-predictive","label":"Posterior predictive checks","level":5,"domain":"bayes","prereqs":["prior-likelihood-posterior","monte-carlo"],"note":"Simulate replicated data and compare to reality. The best Bayesian model check."},{"id":"bayesian-ab","label":"Bayesian A/B testing","level":4,"domain":"bayes","prereqs":["conjugate-priors","ab-testing"],"note":"Probability B beats A, expected loss, and how it differs from a p-value decision rule."},{"id":"probabilistic-programming","label":"Probabilistic programming","level":5,"domain":"bayes","prereqs":["mcmc","hierarchical-bayes"],"note":"Stan, PyMC, or NumPyro. Writing the generative model and letting the sampler do the rest."},{"id":"covariance-matrix","label":"Covariance & correlation matrices","level":3,"domain":"mv","prereqs":["covariance-correlation","vectors-matrices"],"note":"Structure of multivariate spread, positive semidefiniteness, and standardization."},{"id":"mahalanobis","label":"Mahalanobis distance","level":4,"domain":"mv","prereqs":["covariance-matrix","quadratic-forms"],"note":"Distance that accounts for correlation and scale. Multivariate outlier detection."},{"id":"pca","label":"Principal component analysis","level":4,"domain":"mv","prereqs" lihood. The canonical latent variable model."},{"id":"mds","label":"Multidimensional scaling","level":4,"domain":"mv","prereqs":["matrix-decomposition","mahalanobis"],"note":"Place points in low dimensions preserving pairwise distances."},{"id":"tsne-umap","label":"t-SNE & UMAP","level":4,"domain":"mv","prereqs":["pca","kl-divergence"],"note":"Nonlinear embeddings for visual structure. Distances and cluster sizes are not trustworthy."},{"id":"sem","label":"Structural equation modeling","level":5,"domain":"mv","prereqs":["factor-analysis","dag"],"note":"Latent constructs plus a path model. Common in social science and survey research."},{"id":"ts-components","label":"Time series components","level":2,"domain":"ts","prereqs":["univariate-viz"],"note":"Trend, seasonality, cycle, noise, and additive versus multiplicative decomposition."},{"id":"stationarity","label":"Stationarity","level":3,"domain":"ts","prereqs":["ts-components","expectation"],"note":"Constant mean, variance, and autocovariance. Most classical methods assume it."},{"id":"acf-pacf","label":"Autocorrelation & partial autocorrelation","level":3,"domain":"ts","prereqs":["covariance-correlation","stationarity"],"note":"Reading ACF and PACF plots is how you pick AR and MA orders."},{"id":"unit-root","label":"Differencing & unit root tests","level":4,"domain":"ts","prereqs":["stationarity","hypothesis-framework"],"note":"ADF and KPSS, random walks, and the risk of spurious regression between trending series."},{"id":"exponential-smoothing","label":"Exponential smoothing & Holt-Winters","level":3,"domain":"ts","prereqs":["ts-components"],"note":"Weighted recent history with level, trend, and seasonal terms. Strong practical baseline."},{"id":"arma","label":"AR & MA models","level":4,"domain":"ts","prereqs":["acf-pacf","stochastic-processes"],"note":"Regression on lags versus regression on past shocks, and invertibility."},{"id":"arima","label":"ARIMA","level":4,"domain":"ts","prereqs":["arma","unit-root"],"note":"Integrated models for nonstationary series, Box-Jenkins identification and diagnostics."},{"id":"sarima","label":"Seasonal ARIMA & regressors","level":4,"domain":"ts","prereqs":["arima"],"note":"Seasonal lags and exogenous predictors for calendar effects and promotions."},{"id":"forecast-evaluation","label":"Forecast evaluation & backtesting","level":3,"domain":"ts","prereqs":["ts-components","regression-metrics"],"note":"Rolling origin validation, MAPE and sMAPE traps, and always beating a naive baseline."},{"id":"garch","label":"ARCH & GARCH volatility","level":5,"domain":"ts","prereqs":["arima","variance-moments"],"note":"Model variance that clusters over time. Standard in finance and risk."},{"id":"var-model","label":"Vector autoregression","level":5,"domain":"ts","prereqs":["arima","vectors-matrices"],"note":"Multiple interdependent series, impulse responses, and Granger causality."},{"id":"cointegration","label":"Cointegration & error correction","level":5,"domain":"ts","prereqs":["var-model","unit-root"],"note":"Long-run equilibrium between nonstationary series that drift together."},{"id":"state-space","label":"State space & Kalman filter","level":5,"domain":"ts","prereqs":["var-model","multivariate-normal"],"note":"Latent state plus observation noise, recursive updating, and structural time series."},{"id":"spectral-analysis","label":"Spectral analysis","level":5,"domain":"ts","prereqs":["integrals","acf-pacf"],"note":"Frequency domain view: periodograms and how to spot hidden cycles."},{"id":"causal-impact-ts","label":"Interrupted time series & causal impact","level":5,"domain":"ts","prereqs":["state-space","diff-in-diff"],"note":"Estimate the effect of a launch when you could not randomize, using a counterfactual forecast."},{"id":"study-designs","label":"Experimental vs observational studies","level":2,"domain":"causal","prereqs":["population-sample"],"note":"What randomization buys you, and what an observational design must argue instead."},{"id":"randomization","label":"Randomization & assignment units","level":2,"domain":"causal","prereqs":["study-designs","probability-axioms"],"note":"Randomize users, sessions, or clusters. The unit choice determines the analysis unit."},{"id":"control-groups","label":"Control, treatment & blinding","level":2,"domain":"causal","prereqs":["randomization"],"note":"Holdouts, placebo effects, and contamination between arms."},{"id":"blocking","label":"Blocking & stratified randomization","level":3,"domain":"causal","prereqs":["randomization","sampling-methods"],"note":"Balance known nuisance factors up front to cut variance and improve power."},{"id":"factorial-designs","label":"Factorial designs","level":4,"domain":"causal","prereqs":["anova-two-way","blocking"],"note":"Test several factors at once and estimate interactions efficiently."},{"id":"fractional-factorial","label":"Fractional factorial & screening","level":5,"domain":"causal","prereqs":["factorial-designs"],"note":"Resolution and aliasing when you cannot afford all combinations."},{"id":"latin-square","label":"Latin square & crossover designs","level":4,"domain":"causal","prereqs":["blocking","repeated-measures"],"note":"Control two nuisance directions at once, plus carryover concerns in crossovers."},{"id":"response-surface","label":"Response surface methodology","level":5,"domain":"causal","prereqs":["factorial-designs","nonlinear-regression"],"note":"Optimizing a continuous response over factor settings. Industrial and pricing applications."},{"id":"ab-testing","label":"A/B testing end to end","level":3,"domain":"causal","prereqs":["randomization","proportion-tests","sample-size"],"note":"Hypothesis, metric, unit, power, duration, decision rule. The core big tech interview loop."},{"id":"metric-selection","label":"Primary, secondary & guardrail metrics","level":4,"domain":"causal","prereqs":["ab-testing","metric-design"],"note":"One decision metric, a few diagnostics, and guardrails that block harmful wins."},{" n you report."},{"id":"monte-carlo","label":"Monte Carlo simulation","level":3,"domain":"comp","prereqs":["rng","lln"],"note":"Estimate anything you can simulate, with error shrinking at root n."},{"id":"inverse-transform","label":"Inverse transform sampling","level":4,"domain":"comp","prereqs":["quantile-function","rng"],"note":"Turn uniforms into any distribution with an invertible CDF."},{"id":"rejection-sampling","label":"Rejection & importance sampling","level":5,"domain":"comp","prereqs":["monte-carlo","expectation"],"note":"Sample hard distributions with a proposal, and reweight to fix the mismatch."},{"id":"em-algorithm","label":"EM algorithm","level":5,"domain":"comp","prereqs":["mle","jensen"],"note":"Alternate expectation and maximization for latent variables and missing data."},{"id":"newton-optimization","label":"Newton-Raphson & IRLS","level":4,"domain":"comp","prereqs":["optimization-calculus","mle"],"note":"How GLM fitting actually converges, and what a non-convergence warning means."},{"id":"simulation-study","label":"Designing a simulation study","level":4,"domain":"comp","prereqs":["monte-carlo","power"],"note":"Simulate to check power, coverage, and bias of your own analysis plan before running it."},{"id":"reproducible-workflow","label":"Reproducible analysis workflow","level":2,"domain":"comp","prereqs":["data-cleaning"],"note":"Seeds, version control, environments, notebooks that run top to bottom."},{"id":"big-data-stats","label":"Statistics at scale","level":5,"domain":"comp","prereqs":["monte-carlo","standard-error","spark-distributed"],"note":"Sketching, approximate quantiles, streaming variance, and sampling instead of scanning."},{"id":"censoring","label":"Censoring & truncation","level":4,"domain":"surv","prereqs":["random-variables","missing-data"],"note":"Right, left, and interval censoring. Ignoring it silently biases every duration estimate."},{"id":"hazard-survival","label":"Survival & hazard functions","level":4,"domain":"surv","p  code","level":4,"domain":"mlops","prereqs":["ml-lifecycle","data-quality-testing"],"note":"Unit tests on transforms, invariance tests on models, and behavioral test suites."},{"id":"ci-cd-data","label":"CI/CD for data & models","level":4,"domain":"mlops","prereqs":["ml-testing","containerization"],"note":"Automated checks on every pull request so pipelines fail in review, not in production."},{"id":"model-ab-testing","label":"Online testing of models","level":4,"domain":"mlops","prereqs":["ab-testing","deployment-patterns"],"note":"Ship models the way you ship features, with holdouts and guardrails."},{"id":"offline-online-gap","label":"Offline vs online evaluation gap","level":4,"domain":"mlops","prereqs":["model-ab-testing","recsys-ranking"],"note":"Offline AUC gains often do not move the business metric. Understand why before promising lift."},{"id":"latency-cost","label":"Latency, cost & serving constraints","level":4,"domain":"mlops","prereqs":["deployment-patterns"],"note":"The best model you cannot serve in budget is not the best model."},{"id":"retraining-strategy","label":"Retraining & refresh strategy","level":5,"domain":"mlops","prereqs":["drift-monitoring","deployment-patterns"],"note":"Scheduled versus triggered retraining, feedback loops, and self-fulfilling model predictions."},{"id":"scalable-inference","label":"Inference at scale","level":5,"domain":"mlops","prereqs":["latency-cost","spark-distributed"],"note":"Batching, caching, quantization, and horizontal scaling of scoring workloads."},{"id":"responsible-ai-audit","label":"Model risk & responsible AI review","level":5,"domain":"mlops","prereqs":["ethics-privacy","interpretability","model-registry"],"note":"Documentation, bias assessment, challenger models, and sign-off before a model affects people."},{"id":"tensors-autodiff","label":"Tensors & automatic differentiation","level":4,"domain":"dl","prereqs":["neural-nets","multivariable-calculus"],"note":"Computation graphs and reverse mode autodi const BY_ID = {};
DATA.forEach(n => BY_ID[n.id] = n);
DATA.forEach(n => n.unlocks = []);
DATA.forEach(n => n.prereqs.forEach(p => BY_ID[p].unlocks.push(n.id)));

/* step order: a topological sort inside each field, so a concept never
   appears before the concepts it depends on. Ties break by level, then depth. */
function buildStepOrder(){
  DOMAIN_ORDER.forEach(d => {
    const nodes = DATA.filter(n => n.domain === d);
    const inField = new Set(nodes.map(n => n.id));
    const indeg = {};
    nodes.forEach(n => indeg[n.id] = n.prereqs.filter(p => inField.has(p)).length);
    const open = nodes.filter(n => indeg[n.id] === 0);
    const seq = [];
    while (open.length){
      open.sort((a,b) => a.level - b.level || a.depth - b.depth
                       || a.prereqs.length - b.prereqs.length || a.label.localeCompare(b.label));
      const n = open.shift();
      seq.push(n);
      n.unlocks.forEach(uid => {
        if (inField.has(uid) && --indeg[uid] === 0) open.push(BY_ID[uid]);
      });
    }
    seq.forEach((n,i) => { n.step = i + 1; n.stepsInField = seq.length; });
  });
}

/* dependency depth: longest chain of prerequisites behind a node */
(function computeDepth(){
  const memo = {};
  function d(id){
    if (memo[id] !== undefined) return memo[id];
    memo[id] = 0;
    const n = BY_ID[id];
    let m = 0;
    for (const p of n.prereqs) m = Math.max(m, d(p) + 1);
    return memo[id] = m;
  }
  DATA.forEach(n => n.depth = d(n.id));
})();
buildStepOrder();

const KEY = "stats-atlas-v1";

  done: new Set(),
  levels: new Set([1,2,3,4,5]),
  domains: new Set(DOMAIN_ORDER),
  q: "",
  view: "chart",
  labels: false,
  hideDone: false,
  group: "field",
  log: [],
  sel: null,
  hover: null
};

/* ---------------- storage ---------------- */
let saveTimer = null;
let lastSaved = null;
async function load(){
  try{
    const r = await window.storage.get(KEY);
    if (r && r.value){
      const v = JSON.parse(r.value);
      const done = Array.isArray(v) ? v : (v.done || []);
      done.forEach(id => { if (BY_ID[id]) state.done.add(id); });
      state.log = (v && v.log) || [];
      lastSaved = (v && v.updated) || null;
    }
  }catch(e){ /* nothing stored yet, which is the normal first run */ }
}
function recordLog(){
  const today = new Date().toISOString().slice(0,10);
  state.log = state.log.filter(e => e[0] !== today);
  state.log.push([today, state.done.size]);
  state.log.sort((a,b) => a[0] < b[0] ? -1 : 1);
  if (state.log.length > 180) state.log = state.log.slice(-180);
}
function save(){
  recordLog();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    lastSaved = new Date().toISOString();
    try{
      await window.storage.set(KEY, JSON.stringify({v:2, done:[...state.done], log:state.log, updated:lastSaved}));
      const el = document.getElementById("saving");
      el.classList.add("show");
      setTimeout(()=>el.classList.remove("show"), 900);
    }catch(e){
      const el = document.getElementById("saving");
      el.textContent = "not saved, use backup";
      el.classList.add("show");
      setTimeout(()=>el.classList.remove("show"), 2200);
    }
  }, 350);
}
